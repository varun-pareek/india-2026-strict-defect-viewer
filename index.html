<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>India 2026 Strict Defect Pair Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f5;
      --panel: #ffffff;
      --ink: #15202b;
      --muted: #657382;
      --line: #d6dde5;
      --accent: #0d6b63;
      --accent-2: #234d83;
      --warn: #a05a00;
      --bad: #a33c3c;
      --good: #19734d;
      --shadow: 0 10px 30px rgba(23, 38, 52, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(238, 242, 245, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 14px 18px 12px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }
    .sub {
      color: var(--muted);
      margin-top: 2px;
      font-size: 13px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .pill {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 5px 9px;
      color: #344556;
      white-space: nowrap;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) repeat(4, minmax(120px, 170px)) auto;
      gap: 8px;
      padding: 0 18px 14px;
    }
    input, select, textarea, button {
      font: inherit;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 7px;
      padding: 8px 10px;
      min-height: 38px;
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 7px;
      min-height: 38px;
      padding: 8px 11px;
      cursor: pointer;
    }
    button:hover { border-color: #9eacba; }
    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    main {
      padding: 16px 18px 48px;
    }
    .notice {
      display: none;
      border: 1px solid #e4c17d;
      background: #fff9ea;
      color: #60400b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
      align-items: start;
    }
    .list {
      position: sticky;
      top: 124px;
      max-height: calc(100vh - 144px);
      overflow: auto;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }
    .list-row {
      width: 100%;
      display: grid;
      grid-template-columns: 54px 1fr auto;
      gap: 8px;
      align-items: center;
      border: 0;
      border-bottom: 1px solid #edf1f4;
      border-radius: 0;
      text-align: left;
      padding: 9px 10px;
      min-height: 0;
    }
    .list-row.active {
      background: #e7f3f1;
      outline: 2px solid rgba(13, 107, 99, 0.18);
      outline-offset: -2px;
    }
    .idx {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .task {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
    }
    .mini {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }
    .state-dot {
      width: 10px;
      height: 10px;
      border-radius: 99px;
      background: #bcc6d0;
    }
    .state-keep { background: var(--good); }
    .state-maybe { background: var(--warn); }
    .state-reject { background: var(--bad); }
    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }
    .detail {
      display: grid;
      gap: 14px;
    }
    .pair-card, .meta-card, .prompt-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .pair-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    .pair-title {
      font-size: 18px;
      font-weight: 750;
    }
    .pair-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: flex-end;
    }
    .pair-actions button[data-state="keep"].active { background: #dff4e9; border-color: #8cc8a9; color: #145c3f; }
    .pair-actions button[data-state="maybe"].active { background: #fff0d8; border-color: #e2b46e; color: #7a4700; }
    .pair-actions button[data-state="reject"].active { background: #f9e2e2; border-color: #d79999; color: #842f2f; }
    .images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
    }
    figure {
      margin: 0;
      background: #f8fafb;
      min-width: 0;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      padding: 9px 11px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      font-weight: 700;
    }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 550;
    }
    .frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      display: block;
      background: #eef2f5;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 11px 11px;
      font-size: 12px;
    }
    a {
      color: var(--accent-2);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 14px;
    }
    .field {
      border: 1px solid #edf1f4;
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfd;
      min-width: 0;
    }
    .field.wide { grid-column: 1 / -1; }
    .label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .value {
      overflow-wrap: anywhere;
    }
    textarea {
      resize: vertical;
      min-height: 72px;
      margin-top: 8px;
    }
    .prompt-card summary {
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 750;
    }
    pre {
      margin: 0;
      padding: 0 14px 14px;
      overflow: auto;
      white-space: pre-wrap;
      color: #273746;
      font-size: 12px;
    }
    .hidden { display: none; }
    @media (max-width: 1060px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .layout { grid-template-columns: 1fr; }
      .list { position: relative; top: 0; max-height: 280px; }
    }
    @media (max-width: 760px) {
      .bar { grid-template-columns: 1fr; }
      .stats { justify-content: flex-start; }
      .controls { grid-template-columns: 1fr; }
      .images, .meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div>
        <h1>India 2026 Strict Defect Pair Viewer</h1>
        <div class="sub" id="subtitle">Loading pairs...</div>
      </div>
      <div class="stats" id="stats"></div>

    <div class="controls">
      <input id="search" type="search" placeholder="Search task, evidence, URI, source">
      <select id="stateFilter">

        <option value="maybe">Maybe</option>
        <option value="reject">Reject</option>

      <select id="sourceFilter">
        <option value="">All sources</option>
      </select>
      <select id="kindFilter">

        <option value="textile">Textile only</option>
        <option value="local">Has local image</option>

      <select id="sortMode">

        <option value="index">Pair index</option>
        <option value="state">Review state</option>
      </select>
      <button class="primary" id="exportBtn">Export picks</button>
    </div>
  </header>
  <main>
    <div class="notice" id="notice"></div>
    <div class="layout">
      <nav class="list" id="list"></nav>
      <section class="detail" id="detail"></section>
    </div>
  </main>

  </script>
  <script>
    const state = {
      rows: [],
      filtered: [],
      selected: 0,
      summary: null,
      saving: false,
      staticMode: false,
    };
    const reviewStorageKey = 'india-2026-strict-pair-review-v1';

    const $ = (id) => document.getElementById(id);

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function compact(value, fallback = '') {
      const text = String(value ?? '').trim();
      return text || fallback;
    }

    function reviewState(row) {
      return row.manual_review?.state || 'unreviewed';
    }

    function stateClass(row) {
      const value = reviewState(row);
      return value === 'keep' ? 'state-keep' : value === 'maybe' ? 'state-maybe' : value === 'reject' ? 'state-reject' : '';
    }

    function assemblyScore(row) {
      const text = [
        row.source, row.prior_defect_task, row.prior_defect_evidence,
        row.prior_reference_task, row.prior_reference_evidence,
        row.defect_frame_uri, row.reference_frame_uri
      ].join(' ').toLowerCase();
      let score = Number(row.heuristic_score || 0);
      const positive = ['assembly', 'solder', 'circuit', 'pcb', 'wire', 'connector', 'component', 'screw', 'electrical', 'electronic', 'panel', 'metal', 'mechanical', 'kitting', 'iqc', 'oqc', 'smt', 'fatp', 'tws', 'neckband', 'zetwerk'];
      const negative = ['fabric', 'garment', 'textile', 'sewing', 'thread', 'cloth'];
      positive.forEach((term) => { if (text.includes(term)) score += 50; });
      negative.forEach((term) => { if (text.includes(term)) score -= 140; });
      return score;
    }

    function isTextile(row) {
      const text = [row.prior_defect_task, row.prior_defect_evidence, row.defect_frame_uri].join(' ').toLowerCase();
      return ['fabric', 'garment', 'textile', 'sewing', 'thread', 'cloth'].some((term) => text.includes(term));
    }

    function isAssembly(row) {
      return assemblyScore(row) > Number(row.heuristic_score || 0) && !isTextile(row);
    }

    function applyFilters() {
      const q = $('search').value.trim().toLowerCase();
      const stateFilter = $('stateFilter').value;
      const sourceFilter = $('sourceFilter').value;
      const kindFilter = $('kindFilter').value;
      const sortMode = $('sortMode').value;
      state.filtered = state.rows.filter((row) => {
        const haystack = JSON.stringify(row).toLowerCase();
        if (q && !haystack.includes(q)) return false;
        if (stateFilter && reviewState(row) !== stateFilter) return false;
        if (sourceFilter && row.source !== sourceFilter) return false;
        if (kindFilter === 'assembly' && !isAssembly(row)) return false;
        if (kindFilter === 'textile' && !isTextile(row)) return false;
        if (kindFilter === 'local' && row.defect_image_source !== 'local' && row.reference_image_source !== 'local') return false;
        return true;
      });
      state.filtered.sort((a, b) => {
        if (sortMode === 'index') return Number(a.pair_index) - Number(b.pair_index);
        if (sortMode === 'state') return reviewState(a).localeCompare(reviewState(b)) || Number(a.pair_index) - Number(b.pair_index);
        return assemblyScore(b) - assemblyScore(a) || Number(a.pair_index) - Number(b.pair_index);
      });
      if (!state.filtered.some((row) => Number(row.pair_index) === state.selected)) {
        state.selected = Number(state.filtered[0]?.pair_index ?? 0);
      }
      renderList();
      renderDetail();
      renderStats();
    }

    function renderStats() {
      const counts = state.rows.reduce((acc, row) => {
        acc[reviewState(row)] = (acc[reviewState(row)] || 0) + 1;
        return acc;
      }, {});
      const kept = counts.keep || 0;
      const maybe = counts.maybe || 0;
      $('stats').innerHTML = [
        `<span class="pill">${state.filtered.length} shown</span>`,
        `<span class="pill">${state.rows.length} total</span>`,
        `<span class="pill">${kept} keep</span>`,
        `<span class="pill">${maybe} maybe</span>`,
        `<span class="pill">${state.summary?.has_vertex_results ? 'Vertex results loaded' : 'No Vertex results yet'}</span>`
      ].join('');
      $('subtitle').textContent = `${compact(state.summary?.config?.model, 'model unknown')} · ${compact(state.summary?.config?.gcs_manifest, 'local manifest')}`;
    }

    function renderList() {
      const list = $('list');
      if (!state.filtered.length) {
        list.innerHTML = '<div class="empty">No pairs match the filters.</div>';
        return;
      }
      list.innerHTML = state.filtered.map((row) => {
        const active = Number(row.pair_index) === state.selected ? 'active' : '';
        return `
          <button class="list-row ${active}" data-pair="${esc(row.pair_index)}">
            <span class="idx">#${esc(row.pair_index)}</span>
            <span>
              <div class="task">${esc(compact(row.prior_defect_task, 'untitled candidate'))}</div>
              <div class="mini">${esc(compact(row.prior_defect_evidence, row.source))}</div>
            </span>
            <span class="state-dot ${stateClass(row)}"></span>
          </button>
        `;
      }).join('');
      list.querySelectorAll('.list-row').forEach((button) => {
        button.addEventListener('click', () => {
          state.selected = Number(button.dataset.pair);
          renderList();
          renderDetail();
        });
      });
    }

    function gcsLine(label, uri, url) {
      return `
        <a href="${esc(url)}" target="_blank" rel="noreferrer">${label}</a>
        <button data-copy="${esc(uri)}">Copy URI</button>
      `;
    }

    function placeholderImage(label, uri) {
      const detail = uri ? `Private GCS frame: ${uri}` : 'No image URI present';
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
          <rect width="960" height="540" fill="#f3f5f7"/>
          <rect x="24" y="24" width="912" height="492" rx="12" fill="#fff" stroke="#c8d0d8"/>
          <text x="48" y="210" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#26313d">${esc(label)}</text>
          <foreignObject x="48" y="238" width="850" height="180">
            <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:20px;line-height:1.35;color:#52606d;word-break:break-word;">${esc(detail)}</div>
          </foreignObject>
        </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function imageFigure(row, side, label) {
      const uri = row[`${side}_frame_uri`];
      const video = row[`${side}_parent_video_uri`];
      const source = row[`${side}_image_source`] || 'none';
      const imageUrl = row[`${side}_image_url`];
      const resolvedImageUrl = imageUrl && !String(imageUrl).startsWith('gs://') ? imageUrl : placeholderImage(label, uri);
      const consoleUrl = row[`${side}_console_url`];
      return `
        <figure>
          <figcaption>
            <span>${label}</span>
            <span class="tag">${esc(source)}</span>
          </figcaption>
          <img class="frame" src="${esc(resolvedImageUrl)}" alt="${esc(label)} frame">
          <div class="links">
            ${gcsLine('Open frame', uri, consoleUrl)}
            ${video ? gcsLine('Copy video', video, consoleUrl) : ''}
            ${source === 'gcs-cache' ? `<button data-refresh="${esc(uri)}" data-side="${side}">Retry image</button>` : ''}
          </div>
        </figure>
      `;
    }

    function modelBlock(row) {
      const result = row.model_review;
      if (!result) {
        return '<div class="field wide"><div class="label">Vertex review</div><div class="value">No strict Vertex output is present yet.</div></div>';
      }
      return `
        <div class="field"><div class="label">Model decision</div><div class="value">${esc(result.quality_tier || '')} · approved=${esc(result.approved)}</div></div>
        <div class="field"><div class="label">Defect type</div><div class="value">${esc(result.defect_type || '')}</div></div>
        <div class="field wide"><div class="label">Model description</div><div class="value">${esc(result.defect_description || '')}</div></div>
        <div class="field wide"><div class="label">Visible evidence</div><div class="value">${esc((result.visible_evidence || []).join('; '))}</div></div>
      `;
    }

    function renderDetail() {
      const row = state.rows.find((item) => Number(item.pair_index) === state.selected) || state.filtered[0];
      const detail = $('detail');
      if (!row) {
        detail.innerHTML = '<div class="empty">No selected pair.</div>';
        return;
      }
      const manual = row.manual_review || {};
      detail.innerHTML = `
        <article class="pair-card">
          <div class="pair-head">
            <div>
              <div class="pair-title">Pair #${esc(row.pair_index)} · ${esc(compact(row.prior_defect_task, row.source))}</div>
              <div class="sub">${esc(row.source)} · heuristic ${esc(row.heuristic_score ?? '')}</div>
            </div>
            <div class="pair-actions">
              <button data-state="keep" class="${reviewState(row) === 'keep' ? 'active' : ''}">Keep</button>
              <button data-state="maybe" class="${reviewState(row) === 'maybe' ? 'active' : ''}">Maybe</button>
              <button data-state="reject" class="${reviewState(row) === 'reject' ? 'active' : ''}">Reject</button>
              <button data-state="unreviewed" class="${reviewState(row) === 'unreviewed' ? 'active' : ''}">Clear</button>
            </div>
          </div>
          <div class="images">
            ${imageFigure(row, 'defect', 'Image A · candidate defect')}
            ${imageFigure(row, 'reference', 'Image B · candidate reference')}
          </div>
        </article>
        <article class="meta-card">
          <div class="meta-grid">
            <div class="field"><div class="label">Candidate task</div><div class="value">${esc(compact(row.prior_defect_task, ''))}</div></div>
            <div class="field"><div class="label">Reference task</div><div class="value">${esc(compact(row.prior_reference_task, ''))}</div></div>
            <div class="field wide"><div class="label">Candidate evidence</div><div class="value">${esc(compact(row.prior_defect_evidence, ''))}</div></div>
            <div class="field wide"><div class="label">Reference evidence</div><div class="value">${esc(compact(row.prior_reference_evidence, ''))}</div></div>
            ${modelBlock(row)}
            <div class="field wide">
              <div class="label">Manual note</div>
              <textarea id="note">${esc(manual.note || '')}</textarea>
            </div>
          </div>
        </article>
        <details class="prompt-card">
          <summary>Prompt and schema</summary>
          <pre>${esc(state.summary?.config?.prompt || 'Prompt not found in config.')}</pre>
        </details>
      `;
      detail.querySelectorAll('[data-state]').forEach((button) => {
        button.addEventListener('click', () => saveReview(row, button.dataset.state));
      });
      detail.querySelectorAll('[data-copy]').forEach((button) => {
        button.addEventListener('click', () => navigator.clipboard.writeText(button.dataset.copy));
      });
      detail.querySelectorAll('[data-refresh]').forEach((button) => {
        button.addEventListener('click', () => {
          const img = button.closest('figure').querySelector('img');
          img.src = `/image?refresh=1&uri=${encodeURIComponent(button.dataset.refresh)}&t=${Date.now()}`;
        });
      });
      $('note').addEventListener('change', () => saveReview(row, reviewState(row)));
    }

    async function saveReview(row, nextState) {
      if (state.saving) return;
      state.saving = true;
      const note = $('note')?.value || row.manual_review?.note || '';
      if (state.staticMode) {
        row.manual_review = {state: nextState, note, updated_unix: Math.floor(Date.now() / 1000)};
        const reviews = JSON.parse(localStorage.getItem(reviewStorageKey) || '{}');
        reviews[String(row.pair_index)] = row.manual_review;
        localStorage.setItem(reviewStorageKey, JSON.stringify(reviews));
        applyFilters();
        state.saving = false;
        return;
      }
      const response = await fetch('/api/review', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({pair_index: row.pair_index, state: nextState, note})
      });
      const payload = await response.json();
      if (payload.ok) {
        row.manual_review = payload.review;
        applyFilters();
      }
      state.saving = false;
    }

    function applyLocalStoredReviews() {
      const reviews = JSON.parse(localStorage.getItem(reviewStorageKey) || '{}');
      state.rows.forEach((row) => {
        if (reviews[String(row.pair_index)]) row.manual_review = reviews[String(row.pair_index)];
      });
    }

    function csvEscape(value) {
      const text = String(value ?? '');
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function exportCurrentCsv() {
      const selected = state.rows.filter((row) => ['keep', 'maybe'].includes(reviewState(row)));
      const fields = [
        'pair_index', 'manual_state', 'manual_note', 'source', 'heuristic_score',
        'prior_defect_task', 'prior_defect_evidence', 'prior_reference_task',
        'prior_reference_evidence', 'defect_frame_uri', 'defect_parent_video_uri',
        'reference_frame_uri', 'reference_parent_video_uri'
      ];
      const lines = [fields.join(',')];
      selected.forEach((row) => {
        const review = row.manual_review || {};
        const values = {
          ...row,
          manual_state: review.state || '',
          manual_note: review.note || ''
        };
        lines.push(fields.map((field) => csvEscape(values[field])).join(','));
      });
      const blob = new Blob([lines.join('\n') + '\n'], {type: 'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'strict_pair_manual_selection.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function populateSourceFilter() {
      const sources = Array.from(new Set(state.rows.map((row) => row.source).filter(Boolean))).sort();
      $('sourceFilter').innerHTML = '<option value="">All sources</option>' + sources.map((source) => `<option value="${esc(source)}">${esc(source)}</option>`).join('');
    }

    function showNotice() {
      const hasGcs = state.rows.some((row) => row.defect_image_source === 'gcs-cache' || row.reference_image_source === 'gcs-cache');
      const hasLocal = state.rows.some((row) => row.defect_image_source === 'local' || row.reference_image_source === 'local');
      if (hasGcs && !hasLocal) {
        $('notice').style.display = 'block';
        $('notice').textContent = 'Most frames are private GCS objects. The server will render them automatically once the active gcloud account has storage.objects.get on the source bucket; until then image panes show placeholders and the metadata remains reviewable.';
      }
    }

    async function loadPayload() {
      if (window.location.protocol !== 'file:') {
        try {
          const response = await fetch('/api/pairs');
          if (response.ok) return {payload: await response.json(), staticMode: false};
        } catch (error) {
          console.warn('Falling back to embedded viewer data', error);
        }
      }
      if (window.STRICT_PAIR_VIEWER_DATA) {
        return {payload: window.STRICT_PAIR_VIEWER_DATA, staticMode: true};
      }
      throw new Error('No API response and no embedded strict_pair_viewer_data.js payload.');
    }

    async function init() {
      const loaded = await loadPayload();
      const payload = loaded.payload;
      state.staticMode = loaded.staticMode;
      state.rows = payload.rows;
      state.summary = payload.summary;
      if (state.staticMode) applyLocalStoredReviews();
      populateSourceFilter();
      ['search', 'stateFilter', 'sourceFilter', 'kindFilter', 'sortMode'].forEach((id) => {
        $(id).addEventListener('input', applyFilters);
        $(id).addEventListener('change', applyFilters);
      });
      $('exportBtn').addEventListener('click', exportCurrentCsv);
      showNotice();
      applyFilters();
    }

    init().catch((error) => {
      $('detail').innerHTML = `<div class="empty">Failed to load viewer data: ${esc(error.message)}</div>`;
    });
  </script>
</body>
</html>
